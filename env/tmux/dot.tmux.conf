# tmux configuration — MBP M4 (work)
#
# These sessions exist to host Claude Code under a terminal FleetView embeds, so what
# follows is tuned for "a durable PTY carrying one full-screen TUI", not for tmux as a
# window manager. Nothing here is FleetView-specific: `tmux attach` from iTerm2 behaves
# identically, which is the point — the session outlives whichever view is looking at it.

# --- Rendering ---------------------------------------------------------------

# Claude Code's TUI is full-screen, cursor-addressed and colour-heavy, so tmux has to
# advertise a terminal that can carry it. `tmux-256color` is the correct modern entry and
# is present in this machine's terminfo — worth checking before copying this to another
# box, because older macOS ships an ncurses that predates it and needs `screen-256color`.
set -g default-terminal "tmux-256color"

# Truecolor passthrough. Without it 24-bit colour is quantised to 256 and the greys in
# Claude's chrome go muddy.
set -as terminal-features ",*:RGB"

# The status bar costs a row and reads as chrome inside an embedded pane. `set -g status
# on` at a prompt brings it back if you ever drive tmux directly.
set -g status off

# --- Latency -----------------------------------------------------------------

# The most important line in this file. tmux waits this long after ESC to decide whether
# an escape sequence is starting, and the 500ms default makes arrow keys and ESC in any
# TUI feel broken in a way that is easy to misread as the emulator being slow.
set -sg escape-time 0

# --- Sessions ----------------------------------------------------------------

# Resize to the smallest client actually *viewing* a window rather than the smallest
# attached to the session. This is what stops iTerm2 and FleetView being attached at once
# from boxing the session into the smaller of the two.
setw -g aggressive-resize on

# Applications must not rename windows: session discovery keys off stable names.
setw -g allow-rename off
set -g renumber-windows on

# Scrollback worth having. Under alt-screen the emulator's own scrollback stays empty, so
# history lives here or nowhere.
set -g history-limit 100000

# Let applications see focus changes.
set -g focus-events on

# Mouse on, mainly for scrollback: with a full-screen TUI holding the alt-screen there is
# nothing for the outer emulator to scroll, so the wheel has to reach tmux's copy-mode.
# Applications that request mouse reporting still receive events normally.
set -g mouse on

# NOT set: `remain-on-exit on`. Worth knowing why, because the default behaviour surprises.
# `tmux new -s foo claude` makes claude the session's only process, so the moment it exits
# the window closes, the session is destroyed, and — if it was the last session — the
# server exits too. The client prints a bare "[exited]" and the session is simply gone,
# including whatever output explained why. `remain-on-exit on` would keep the dead pane
# readable, at the cost of dead panes accumulating that you must kill by hand. The better
# fix is at launch: start the session with a shell and run claude inside it, so claude
# exiting drops to a prompt and the session persists on purpose rather than by setting.

# --- Keys --------------------------------------------------------------------

# C-b is backward-char in Claude Code's input box, so the default prefix quietly steals a
# key used constantly while editing a prompt. C-Space is unclaimed.
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload without restarting a session.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"
